name: Daily accuracy collection
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: accuracy-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        with:
          path: .data
          key: accuracy-checkpoint-${{ github.run_id }}
          restore-keys: accuracy-checkpoint-
      - name: Resume rate-limited census, with time for checkpoint saving
        env:
          WB_COLLECT_ONLY: '1'
          WB_COLLECTION_BUDGET_MS: '17400000'
        run: node scripts/serve.mjs
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .data
          key: accuracy-checkpoint-${{ github.run_id }}
      - name: Publish only the last completed aggregate
        run: |
          if [ -f .data/baseline.json ]; then
            cp .data/baseline.json assets/daily-baseline.json
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add assets/daily-baseline.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update completed weapon accuracy averages'
              git push
            fi
          fi
